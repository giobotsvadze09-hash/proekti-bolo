<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Account - Foodie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif;">
    <div style="background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 400px; text-align: center;">
        <h2 style="margin-bottom: 10px; color: #111;">Verify Your Email</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">We sent a 6-digit code to <span id="userEmailDisplay" style="font-weight: bold; color: #333;">your email</span></p>
        
        <form id="verifyForm">
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; color: #333;">Verification Code</label>
                <input type="text" id="verificationCode" placeholder="Enter 6-digit code" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem;">
            </div>
            <button type="submit" style="width: 100%; padding: 12px; background: #ff5722; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;">Verify</button>
        </form>

        <div style="margin-top: 20px; font-size: 0.85rem; color: #666; display: flex; justify-content: space-between;">
            <span>Didn't receive the code?</span>
            <a href="#" id="resendBtn" style="color: #ff5722; text-decoration: none; font-weight: bold;">Resend Code</a>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="login.html" style="color: #ff5722; text-decoration: none; font-size: 0.85rem; font-weight: bold;">Back to Login</a>
        </div>
    </div>

    <script src="verify.js"></script>
</body>
</html>
